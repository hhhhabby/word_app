<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词谐音助记生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f7f8fb;
            color: #222222;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #222222;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            text-decoration: none;
            color: #222222;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        nav a.active {
            color: #dc2626;
            border-bottom-color: #dc2626;
        }

        main {
            max-width: 840px;
            margin: 64px auto;
            padding: 0 24px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 18px;
            color: #555555;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .upload-area {
            background-color: #ffffff;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            padding: 52px 40px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #dc2626;
            background-color: #fff5f5;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .upload-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .drop-hint,
        .hint {
            color: #555555;
            line-height: 1.6;
        }

        .drop-hint {
            margin-top: 16px;
        }

        .hint {
            margin-top: 24px;
            font-size: 14px;
        }

        .progress-panel {
            margin-top: 24px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #ffffff;
            text-align: left;
            display: none;
        }

        .progress-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .progress-stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .progress-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
        }

        .progress-item .label {
            display: block;
            color: #666666;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .progress-item .value {
            display: block;
            color: #222222;
            font-size: 20px;
            font-weight: 700;
        }

        .progress-bar-wrap {
            height: 14px;
            width: 100%;
            background: #ececec;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #dc2626;
            transition: width 0.3s ease;
        }

        .progress-status {
            margin-top: 10px;
            color: #444444;
            font-size: 14px;
        }

        @media (max-width: 860px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            nav {
                flex-wrap: wrap;
            }

            .progress-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">WORD</div>
        <nav>
            <a href="{{ url_for('pages.index') }}">功能总览</a>
            <a href="{{ url_for('pages.pdf_to_excel_page') }}">PDF 到 Excel</a>
            <a href="{{ url_for('pages.excel_mnemonic_page') }}" class="active">Excel 趣记写回</a>
        </nav>
    </header>

    <main>
        <h1>单词谐音助记生成器</h1>
        <p class="subtitle">上传包含“英文”列的 Excel 文件，系统会批量查询趣记单词接口，并把谐音助记写回新列。</p>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls" required>
            <button class="upload-btn" id="uploadBtn">选择 Excel 文件</button>
            <p class="drop-hint" id="fileName">也可以直接拖拽文件到这里</p>
        </div>

        <p class="hint">请确认 Excel 表格中包含标题为“英文”的列。处理会逐词查询接口，耗时与单词数量有关。</p>

        <section id="progressPanel" class="progress-panel">
            <div class="progress-title">处理进度</div>
            <div class="progress-stats">
                <div class="progress-item">
                    <span class="label">总单词数</span>
                    <span class="value" id="totalWords">0</span>
                </div>
                <div class="progress-item">
                    <span class="label">已处理</span>
                    <span class="value" id="processedWords">0</span>
                </div>
                <div class="progress-item">
                    <span class="label">剩余</span>
                    <span class="value" id="remainingWords">0</span>
                </div>
                <div class="progress-item">
                    <span class="label">运行秒数</span>
                    <span class="value" id="elapsedSeconds">0</span>
                </div>
            </div>
            <div class="progress-bar-wrap">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <div id="progressStatus" class="progress-status">等待开始...</div>
        </section>
    </main>

    <script>
        const API_PROCESS_EXCEL_URL = "{{ url_for('excel_api.process_excel_file') }}";
        const API_PROGRESS_URL = "{{ url_for('pdf_api.get_progress') }}";

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileName = document.getElementById('fileName');
        const progressPanel = document.getElementById('progressPanel');
        const totalWordsEl = document.getElementById('totalWords');
        const processedWordsEl = document.getElementById('processedWords');
        const remainingWordsEl = document.getElementById('remainingWords');
        const elapsedSecondsEl = document.getElementById('elapsedSeconds');
        const progressBarFillEl = document.getElementById('progressBarFill');
        const progressStatusEl = document.getElementById('progressStatus');

        let progressTimer = null;
        let startedAtMs = null;

        uploadBtn.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (event) => {
            event.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (event) => {
            event.preventDefault();
            uploadArea.classList.remove('dragover');
            if (event.dataTransfer.files.length) {
                fileInput.files = event.dataTransfer.files;
                processFile();
            }
        });

        fileInput.addEventListener('change', processFile);

        function setProgress(percentage) {
            const value = Math.max(0, Math.min(100, Math.round(percentage)));
            progressBarFillEl.style.width = value + '%';
        }

        function startProgressPolling() {
            progressPanel.style.display = 'block';
            progressStatusEl.textContent = '正在处理...';
            setProgress(0);
            clearInterval(progressTimer);
            progressTimer = setInterval(fetchProgress, 600);
        }

        function stopProgressPolling() {
            clearInterval(progressTimer);
            progressTimer = null;
        }

        async function fetchProgress() {
            try {
                const response = await fetch(API_PROGRESS_URL, { cache: 'no-store' });
                const data = await response.json();
                const total = Number(data.total || 0);
                const processed = Number(data.processed || 0);
                const remaining = Number(data.remaining || 0);

                totalWordsEl.textContent = total;
                processedWordsEl.textContent = processed;
                remainingWordsEl.textContent = remaining;

                if (data.start_time) {
                    const startMs = new Date(data.start_time).getTime();
                    if (!Number.isNaN(startMs)) {
                        startedAtMs = startMs;
                    }
                }

                const endMs = data.end_time ? new Date(data.end_time).getTime() : Date.now();
                if (startedAtMs && !Number.isNaN(endMs)) {
                    elapsedSecondsEl.textContent = Math.max(0, Math.floor((endMs - startedAtMs) / 1000));
                }

                setProgress(total > 0 ? (processed / total) * 100 : 0);
                progressStatusEl.textContent = data.is_processing ? (data.stage || `处理中：${processed}/${total}`) : (data.stage || '处理结束');

                if (!data.is_processing) {
                    stopProgressPolling();
                }
            } catch (error) {
                progressStatusEl.textContent = '进度读取失败';
            }
        }

        async function processFile() {
            const file = fileInput.files[0];
            if (!file) {
                return;
            }
            if (!file.name.toLowerCase().match(/\.(xlsx|xls)$/)) {
                alert('请上传 Excel 文件');
                return;
            }

            fileName.textContent = '已选择：' + file.name;
            startedAtMs = Date.now();
            totalWordsEl.textContent = '0';
            processedWordsEl.textContent = '0';
            remainingWordsEl.textContent = '0';
            elapsedSecondsEl.textContent = '0';
            startProgressPolling();

            uploadBtn.disabled = true;
            uploadBtn.innerText = '正在处理...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(API_PROCESS_EXCEL_URL, { method: 'POST', body: formData });
                if (!response.ok) {
                    throw new Error(await response.text() || '处理失败');
                }

                await fetchProgress();
                progressStatusEl.textContent = '处理完成，正在下载文件...';
                setProgress(100);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = '带谐音助记.xlsx';
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                await fetchProgress();
                progressStatusEl.textContent = '处理失败';
                alert(error.message || '处理失败');
            } finally {
                stopProgressPolling();
                uploadBtn.disabled = false;
                uploadBtn.innerText = '选择 Excel 文件';
                fileInput.value = '';
            }
        }
    </script>
</body>

</html>
